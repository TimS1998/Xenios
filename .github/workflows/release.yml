name: Release

# Ein Tag v* (z. B. v2.0.0) erzeugt:
#  - ein GitHub-Release mit der Android-App (APK) als Download
#  - das Docker-Image in GitHub Packages: ghcr.io/<besitzer>/xenios:<version> und :latest (amd64 + arm64)
#
#   git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  apk:
    uses: ./.github/workflows/app.yml
    secrets: inherit

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und veröffentlichen
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xenios"
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build server \
            --file docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          { echo "### Docker-Image"; echo "${IMAGE}:${VERSION}"; } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [apk, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Xenios-APK

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xenios"
          cat > notes.md <<EOF
          ## Android-App
          \`Xenios-*.apk\` unten herunterladen und auf dem Handy installieren (ab Android 11).

          ## Server (Docker)
          \`\`\`
          docker pull ${IMAGE}:${GITHUB_REF_NAME#v}
          \`\`\`
          Oder in \`docker/.env\`: \`XENIOS_IMAGE=${IMAGE}:latest\` und \`XENIOS_PULL=always\`, dann \`docker compose up -d\`.
          EOF
          gh release create "$GITHUB_REF_NAME" Xenios-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Xenios $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
