<!doctype html>
<html lang="de" data-style="xenia" data-gauge="black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#383c44" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2b2d34" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Xenios</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn gone" id="back-btn" type="button" aria-label="Zurück" title="Zurück" data-i18n-aria-label="common.back" data-i18n-title="common.back" data-noanim></button>
      <h1 class="topbar-title" id="title" data-noanim><span class="tt">Xenios</span></h1>
      <div class="topbar-actions" id="topbar-actions"></div>
      <span class="conn-dot" id="conn-dot" title="Verbindung" data-i18n-title="app.shell.connection"></span>
    </header>
    <nav class="tabs" id="tabs" hidden></nav>
    <div class="model-hint" id="model-hint" role="alert" hidden></div>
    <main class="view" id="view" tabindex="-1"></main>
    <nav class="navbar" id="navbar" aria-label="Hauptnavigation" data-i18n-aria-label="app.shell.mainNav"></nav>
  </div>

  <section id="login" class="login" hidden>
    <form class="login-card" id="login-form" autocomplete="on">
      <img src="/icons/icon.svg" alt="" class="login-icon" width="72" height="72">
      <h1>Xenios</h1>
      <p class="muted" data-i18n="app.login.prompt">Bitte mit dem App-Passwort anmelden.</p>
      <label class="field">
        <span data-i18n="app.login.password">Passwort</span>
        <input type="password" name="password" id="login-password" autocomplete="current-password" required autofocus>
      </label>
      <label class="check">
        <input type="checkbox" id="login-remember" checked>
        <span data-i18n="app.login.remember">Auf diesem Gerät angemeldet bleiben</span>
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn filled wide" type="submit" id="login-submit" data-i18n="app.login.submit">Anmelden</button>
    </form>
  </section>

  <section id="setup" class="login setup" hidden></section>

  <div id="splash" class="splash"><img src="/icons/icon.svg" alt="" width="64" height="64"></div>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>
</body>
</html>
